name: 🐞 Bug Report
description: Report an error or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
type: bug
body:
    - type: markdown
      attributes:
          value: |
              Thank you for reporting an issue! Please fill out the form as detailed as possible to help us investigate.
    - type: textarea
      id: description
      attributes:
          label: Description
          description: Provide a clear and concise description of what the bug is.
      validations:
          required: true
    - type: textarea
      id: reproduction-steps
      attributes:
          label: Steps to Reproduce
          description: How can we reproduce the problem?
          value: |
              1.
              2.
              3.
      validations:
          required: true
    - type: textarea
      id: expected-behavior
      attributes:
          label: Expected Behavior
          description: What did you expect to happen?
      validations:
          required: true
    - type: input
      id: environment
      attributes:
          label: Environment
          description: e.g., Ubuntu 24.04, Android 15 (Emulator), or specific device model.
      validations:
          required: true
    - type: textarea
      id: logs
      attributes:
          label: Logs / Output (Logcat, KSP, Gradle)
          description: Attach relevant logs, crash traces, or console output. Please use code blocks.
          render: shell
